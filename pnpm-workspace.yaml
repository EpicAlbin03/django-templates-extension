packages:
  - apps/*
  - packages/*
  - tools/*

catalogMode: prefer

catalog:
  "@types/node": ^22.18.0
  vite: npm:@voidzero-dev/vite-plus-core@1.3.0
  vitest: 5.0.5
  vite-plus: 1.3.0
  "@changesets/cli": ^3.0.3
  "@changesets/changelog-github": ^1.0.1
  oxlint: 1.88.0
  "@oxlint/plugins": 1.88.0
overrides:
  vite@*: "catalog:"
  vitest@*: "catalog:"
peerDependencyRules:
  allowAny:
    - vite
    - vitest
  allowedVersions:
    vite: "*"
    vitest: "*"
minimumReleaseAge: 2880
minimumReleaseAgeExclude:
  - prettier-plugin-django-templates
